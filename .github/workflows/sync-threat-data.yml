name: Sync CISA KEV metrics

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cisa-kev-metrics
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and aggregate CISA KEV data
        run: node scripts/sync-threat-data.mjs
      - name: Commit updated metrics
        run: |
          if git diff --quiet -- public/data/active-threats.json; then
            echo "No threat metric changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/active-threats.json
          git commit -m "chore: refresh CISA KEV metrics"
          git push
